name: Update Media Config

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Media key to update (hero, product-1, etc.)'
        required: true
        type: string
      imageUrl:
        description: 'New image URL from Cloudinary'
        required: true
        type: string

jobs:
  update-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          sparse-checkout: |
            liangsen_jindian/config.json
          sparse-checkout-cone-mode: false

      - name: Update config.json
        run: |
          cd liangsen_jindian
          CONFIG=$(cat config.json)
          # Update the specific key
          echo "$CONFIG" | jq --arg key "${{ inputs.target }}" --arg url "${{ inputs.imageUrl }}" \
            'if .[$key] != null then .[$key] = $url else . end' > config.json.tmp
          mv config.json.tmp config.json
          cat config.json

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add liangsen_jindian/config.json
          git diff --staged --quiet || git commit -m "update media: ${{ inputs.target }}"
          git push
